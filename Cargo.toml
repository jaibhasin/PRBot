[package]
name = "prbot"
version = "0.1.0"
edition = "2021"
description = "Open-source multi-agent PR reviewer for GitHub Actions"
license = "MIT"
repository = "https://github.com/your-github-user/prbot"
readme = "README.md"
keywords = ["github", "actions", "pr", "review", "llm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
