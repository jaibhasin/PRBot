[package]
name = "prbot"
version = "1.0.0"
edition = "2021"
description = "Open-source multi-agent PR reviewer for GitHub Actions"
license = "MIT"
repository = "https://github.com/jaibhasin/prbot"
readme = "README.md"
keywords = ["github", "actions", "pr", "review", "llm"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive", "env"] }
futures = "0.3"
globset = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-go = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

[profile.release]
lto = true
codegen-units = 1
strip = true
