# Example workflow for repositories that install PRBot.
# Copy this file to: .github/workflows/prbot.yml
name: PRBot

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  issue_comment:
    types: [created]

permissions:
  checks: write
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    # PRBot performs the authoritative owner permission check before any LLM call.
    if: ${{ github.event_name == 'pull_request' || (github.event.issue.pull_request && github.event.sender.type != 'Bot') }}
    runs-on: ubuntu-latest
    steps:
      - name: Run PRBot
        uses: jaibhasin/PRBot@v0.2.0
        with:
          openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
          # Optional. If omitted, the job's GITHUB_TOKEN is used.
          github_token: ${{ secrets.GITHUB_TOKEN }}
