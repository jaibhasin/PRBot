# CI for the PRBot crate itself (not the end-user install workflow).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Evaluation scorer smoke test
        run: python3 scripts/evaluate.py evals/sample.jsonl --allow-small-sample

      - name: Build release
        run: cargo build --release

      - name: Smoke CLI
        run: |
          ./target/release/prbot version
          ./target/release/prbot review --help
