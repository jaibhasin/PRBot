# CI for the PRBot crate itself (not the end-user install workflow).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

      - name: Evaluation scorer smoke test
        run: |
          python3 scripts/evaluate.py evals/sample.jsonl --allow-small-sample
          python3 scripts/evaluate_routing.py evals/router/sample-results.jsonl

      - name: Fixture catalog present
        run: |
          test "$(wc -l < evals/fixtures/catalog.jsonl | tr -d ' ')" = "50"
          cp evals/fixtures/catalog.jsonl /tmp/catalog-before.jsonl
          python3 scripts/generate_fixture_catalog.py
          test "$(wc -l < evals/fixtures/catalog.jsonl | tr -d ' ')" = "50"
          # Regenerating must not shrink protected rows if any exist.
          python3 - <<'PY'
          import json
          from pathlib import Path
          before = [json.loads(line) for line in Path('/tmp/catalog-before.jsonl').read_text().splitlines() if line.strip()]
          after = [json.loads(line) for line in Path('evals/fixtures/catalog.jsonl').read_text().splitlines() if line.strip()]
          protected = {row['case_id'] for row in before if row.get('status') in {'ready','adjudicated','retired'}}
          after_ids = {row['case_id'] for row in after}
          missing = protected - after_ids
          assert not missing, missing
          PY

      - name: Fixture batch runner help
        run: python3 scripts/run_fixture_batch.py --help

      - name: Build release
        run: cargo build --release

      - name: Smoke CLI
        run: |
          ./target/release/prbot version
          ./target/release/prbot review --help
